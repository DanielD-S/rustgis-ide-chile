[package]
name = "ide-chile"
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DanielD-S/rustgis-ide-chile"
rust-version = "1.90"
publish = false

# A plugin is a WebAssembly module: build and package it with
#   python scripts/package.py
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustgis-plugin = { git = "https://github.com/opengeos/rustgis-plugins" }
# The CUT tools read a request themselves, keeping each feature's geometry as the JSON text it
# came as (serde_json's RawValue), so a layer's coordinates are copied through, never parsed.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Small, fast plugin modules. A panic aborts: RustGIS reports it as the plugin failing.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
