name: Services

# Every week, each layer's service must still answer what the plugin asks it
# (scripts/check_services.py: one feature of each layer, with its geometry, and each map image).
# A week with problems opens an issue, or updates the open one; a week where every service
# answers closes it. A pull request that touches the layers or the check runs it too, and shows
# the report in the run's summary without failing for a service that's down.
on:
  schedule:
    - cron: "17 11 * * 1" # Mondays, 08:17 in Chile
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/services.yml"
      - "scripts/check_services.py"
      - "examples/probes.rs"
      - "generate.py"
      - "services.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: services-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the services
        id: check
        continue-on-error: true
        run: python scripts/check_services.py --report report.md
      - name: Open, update or close the issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Services check: some layers' services don't answer"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Every layer's service answers again: $RUN_URL"
            fi
            exit 0
          fi
          { cat report.md; echo; echo "Run: $RUN_URL"; } > body.md
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file body.md
            exit 0
          fi
          # The open issue keeps the latest report; a comment only when the failing requests change.
          gh issue view "$number" --json body --jq .body | grep '^| `' > before.txt || true
          grep '^| `' report.md > after.txt || true
          gh issue edit "$number" --body-file body.md
          if ! cmp -s before.txt after.txt; then
            gh issue comment "$number" --body "The failing requests changed: $RUN_URL"
          fi
